<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | LAVISH</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/checkout.css">
    <script src="https://kit.fontawesome.com/dec481ddd6.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <div class="top-header">
            <div class="container d-flex justify-content-between align-items-center">
                <div>New Year Sale is Live Now</div>
                    <div class="d-flex gap-3">
                    <a href="https://www.instagram.com/lavish.jor1/"><i class="fa-brands fa-instagram"></i> FOLLOW LAVISH JO</a>
                </div>
            </div>
        </div>
        <div class="bottom-header">
            <div class="container d-flex justify-content-between align-items-center">
                <div class="header-logo">
                    <a href="index.html"><img src="assets/images/LAVISH.png" alt="Lavish Logo"></a>
                </div>
                <nav class="navbar">
                    <ul class="d-flex gap-4">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="about.html">About</a></li>
                        <li><a href="products.html">Products</a></li>
                        <li><a href="faq.html">FAQ</a></li>
                        <li><a href="contact.html">Contact Us</a></li>
                    </ul>
                </nav>
                <div class="header-account">
                    <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="page-title">
            <h1>Checkout</h1>
            <div class="breadcrumb"><a href="index.html">Home</a> <span>></span> <a href="cart.html">Cart</a> <span>></span> <span>Checkout</span></div>
        </div>

        <section class="checkout-section">
            <div class="row">
                <div style="flex: 0 0 60%; padding: 0 15px;">
                    <div class="checkout-form">
                        <h2>Shipping Information</h2>
                        <form id="checkout-form">
                            <div class="row">
                                <div style="flex: 0 0 50%; padding: 0 10px;" class="form-group">
                                    <label>First Name</label>
                                    <input type="text" placeholder="Haitham" required>
                                </div>
                                <div style="flex: 0 0 50%; padding: 0 10px;" class="form-group">
                                    <label>Last Name</label>
                                    <input type="text" placeholder="Haddad" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Address</label>
                                <input type="text" placeholder="123 PSUT.AMMAN " required>
                            </div>
                            <div class="row">
                                <div style="flex: 0 0 50%; padding: 0 10px;" class="form-group">
                                    <label>City</label>
                                    <input type="text" placeholder="Amman" required>
                                </div>
                                <div style="flex: 0 0 50%; padding: 0 10px;" class="form-group">
                                    <label>Phone Number</label>
                                    <input type="tel" placeholder="07XXXXXXXX" required>
                                </div>
                            </div>

                            <h2 style="margin-top: 30px;">Payment Method</h2>
                            <div class="form-group">
                                <label>Card Number</label>
                                <input type="text" placeholder="XXXX XXXX XXXX XXXX">
                            </div>
                            <button type="submit" class="button-animation" style="width: 100%; justify-content: center; margin-top: 20px;">Place Order (Simulation)</button>
                        </form>
                    </div>
                </div>

                <div style="flex: 0 0 40%; padding: 0 15px;">
                    <div class="order-summary">
                        <h2>Order Summary</h2>
                        <div id="checkout-summary-list">
                            </div>
                        <div class="summary-total">
                            <span>Total</span>
                            <span id="cart-total-amount">0.00 JOD</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="bottom-footer">&copy; 2025 Lavish. All Rights Reserved</div>
        </div>
    </footer>

    <script src="assets/js/cart.js"></script>
    <script>
        //Simulation alert
        document.getElementById('checkout-form').onsubmit = function(e) {
            e.preventDefault();
            alert("Order placed successfully! This is a simulated checkout.");
            localStorage.clear(); //Clear cart after submit
            window.location.href = "index.html"; //To get back to home page
        };
    </script>
</body>
</html>

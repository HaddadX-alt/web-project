<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cart | LAVISH</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/cart.css">
    <script src="https://kit.fontawesome.com/dec481ddd6.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="top-header">
            <div class="container d-flex justify-content-between align-items-center">
                <div>New Year Sale is Live Now</div>
                    <div class="d-flex gap-3">
                        <a href="https://www.instagram.com/lavish.jor1/"><i class="fa-brands fa-instagram"></i> FOLLOW LAVISH JO</a>
                    </div>
            </div>
    </div>

    <main class="container">
        <div class="page-title">
            <h1>Your Shopping Cart</h1>
            <div class="breadcrumb"><a href="Products.html">Products</a> <span>></span> <span>Cart</span></div>
        </div>
    <main class="container" style="padding: 50px 0;">
        <h1>Shopping Cart Items</h1>
        <table style="width:100%; border-collapse: collapse; margin-top:30px;">
            <thead style="background:#f4f4f4;">
                <tr>
                    <th style="padding:15px; text-align:left;">Product</th>
                    <th style="padding:15px; text-align:left;">Price</th>
                    <th style="padding:15px; text-align:left;">Quantity</th>
                    <th style="padding:15px; text-align:left;">Total</th>
                    <th style="padding:15px; text-align:left;"></th>
                </tr>
            </thead>
            <tbody id="cart-items-body">
                </tbody>
        </table>

        <div style="text-align:right; margin-top:40px; padding:20px; border-top:2px solid #eee;">
            <h3>Subtotal: <span id="cart-total-amount">0.00 JOD</span></h3>
            <br>
            <a href="checkout.html" class="button-animation">Proceed to checkout</a>
            </div>
    </main>

    <script src="assets/js/cart.js"></script>
</body>
</html>
